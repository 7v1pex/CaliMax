<body>

<style>
/* Layout: one-screen phone app — scrolling content area above a fixed tab bar, max 560px wide on desktop. Dark, single look. */
:root {
  --bg: #0F1115; --surface: #1A1D23; --surface-2: #2A2E37; --line: #23272F; --ghost: #2E333C;
  --fg: #F2F3F5; --soft: #C9CDD4; --muted: #A3A8B3; --dim: #6B717C;
  --gym: #C6F432; --cali: #FF8A3D; --accent: #C6F432; --on-accent: #0F1115; --warn: #FFB08A;
  --font-display: 'Space Grotesk', 'Segoe UI', system-ui, sans-serif;
  --font-body: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-body); font-size: 15px; -webkit-tap-highlight-color: transparent; }
body.mode-cali { --accent: var(--cali); }
body.mode-gym { --accent: var(--gym); }
* { box-sizing: border-box; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#app { height: 100%; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; }
.screen { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch;
  padding-block: 20px 28px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-direction: column; gap: 18px; }
.screen > * { flex-shrink: 0; }
.tabbar { flex-shrink: 0; display: grid; background: #15181D; border-top: 1px solid var(--line);
  padding: 6px max(8px, env(safe-area-inset-right, 0px)) 8px max(8px, env(safe-area-inset-left, 0px)); }
.tab { border: none; background: none; min-height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 500; color: var(--muted); }
.tab.on { color: var(--accent); font-weight: 600; }
.foot { flex-shrink: 0; border-top: 1px solid var(--line); background: var(--bg);
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) 14px max(16px, env(safe-area-inset-left, 0px)); display: flex; gap: 10px; }

h1, h2, h3 { margin: 0; font-family: var(--font-display); letter-spacing: -0.4px; text-wrap: balance; }
h1 { font-size: 28px; font-weight: 700; }
h2 { font-size: 18px; font-weight: 600; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.9px; color: var(--accent); }
.num { font-family: var(--font-display); font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 12px; }
.between { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.card { background: var(--surface); border-radius: 18px; padding: 16px; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.tile { background: var(--surface); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tile .k { font-size: 12px; color: var(--muted); }
.tile .v { font-family: var(--font-display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; }
.tile .v small { font-size: 14px; color: var(--muted); font-weight: 500; }

.btn { border: none; min-height: 52px; padding: 0 18px; border-radius: 16px; font-weight: 600; font-size: 15px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn-primary { background: var(--accent); color: var(--on-accent); }
.btn-dark { background: var(--bg); color: var(--fg); }
.btn-soft { background: var(--surface); color: var(--fg); }
.btn-line { background: transparent; color: var(--fg); border: 1px solid var(--surface-2); }
.btn-grow { flex: 1; }
.btn-sm { min-height: 44px; border-radius: 12px; font-size: 14px; padding: 0 14px; }
.icon-btn { width: 44px; height: 44px; border-radius: 22px; border: none; background: var(--surface); color: var(--fg); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.link { background: none; border: none; color: var(--accent); font-weight: 600; font-size: 14px; min-height: 44px; padding: 0; display: inline-flex; align-items: center; gap: 6px; }

.chips { display: flex; gap: 8px; flex-wrap: wrap; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; margin: 0 calc(-1 * max(16px, env(safe-area-inset-left, 0px))); padding: 0 max(16px, env(safe-area-inset-left, 0px)); scrollbar-width: none; }
.chip { flex-shrink: 0; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1px solid var(--surface-2); background: transparent; color: var(--fg); font-size: 14px; font-weight: 500; white-space: nowrap; }
.chip.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); font-weight: 600; }
.seg { display: grid; gap: 4px; background: var(--surface); border-radius: 14px; padding: 4px; }
.seg button { min-height: 44px; border: none; border-radius: 10px; background: transparent; color: var(--muted); font-size: 14px; font-weight: 500; }
.seg button.on { background: var(--fg); color: var(--bg); font-weight: 600; }

.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 4px; background: var(--accent); }
.bar > i.grey { background: #5A5F6B; }

/* start */
.start-card { text-align: left; border: 2px solid var(--surface-2); background: var(--surface); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 12px; color: var(--fg); }
.start-card .ic { width: 56px; height: 56px; border-radius: 18px; display: flex; align-items: center; justify-content: center; color: var(--on-accent); }
.pill { font-size: 12px; font-weight: 500; color: var(--soft); border: 1px solid var(--surface-2); border-radius: 999px; padding: 5px 10px; }

/* home */
.hero { text-align: left; background: var(--accent); color: var(--on-accent); border-radius: 24px; padding: 20px; display: flex; flex-direction: column; gap: 14px; }
.hero h2 { font-size: 26px; font-weight: 700; }
.hero .tag { font-size: 12px; font-weight: 600; background: rgba(15,17,21,0.12); padding: 6px 10px; border-radius: 999px; }
.hero.rest { background: var(--surface); color: var(--fg); }
.week { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px; }
.wd { height: 60px; border-radius: 14px; background: var(--surface); border: 1px solid transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--muted); font-size: 12px; font-weight: 600; }
.wd .n { font-family: var(--font-display); font-size: 16px; color: inherit; }
.wd.train { color: var(--fg); }
.wd.today { background: var(--fg); color: var(--bg); }
.wd .dot { width: 6px; height: 6px; border-radius: 3px; background: transparent; }
.wd.train .dot { background: var(--accent); }
.wd.done { box-shadow: inset 0 -3px 0 var(--accent); }

/* plan */
.day { background: var(--surface); border-radius: 16px; border: 1px solid transparent; overflow: hidden; }
.day.rest { background: #14171C; }
.day.open { border-color: #3A3F4A; }
.day-head { width: 100%; min-height: 64px; padding: 12px 14px; border: none; background: transparent; color: var(--fg); display: flex; align-items: center; gap: 12px; text-align: left; }
.badge { width: 40px; height: 40px; border-radius: 12px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 14px; background: var(--surface-2); color: var(--accent); }
.day.rest .badge { background: transparent; border: 1px solid var(--surface-2); color: var(--muted); }
.day.done .badge { background: var(--accent); color: var(--on-accent); }
.day-body { padding: 0 14px 14px; display: flex; flex-direction: column; }
.blk { font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.8px; color: var(--accent); padding: 12px 0 4px; }
.item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--surface-2); }
.item .t { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.item .d { font-family: var(--font-display); font-weight: 600; font-size: 14px; color: var(--soft); text-align: right; flex-shrink: 0; }
.mrow { display: grid; grid-template-columns: 86px 1fr 30px; gap: 10px; align-items: center; font-size: 12px; }

/* training */
.prog { display: flex; gap: 4px; }
.prog i { flex: 1; height: 4px; border-radius: 2px; background: var(--surface-2); }
.prog i.done { background: var(--accent); } .prog i.skip { background: #5A5F6B; } .prog i.cur { background: var(--fg); }
.sets-head, .set { display: grid; gap: 4px; align-items: center; }
.sets-head { font-size: 12px; color: var(--muted); font-weight: 500; padding: 0 4px 0 10px; }
.set { background: var(--surface); border-radius: 14px; padding: 6px 4px 6px 10px; }
.set.isdone { color: var(--muted); }
.step { display: flex; align-items: center; gap: 2px; }
.step button { width: 34px; height: 40px; border-radius: 10px; border: none; background: var(--surface-2); color: var(--fg); font-size: 18px; flex-shrink: 0; }
.step span { flex: 1; min-width: 34px; text-align: center; font-weight: 600; font-variant-numeric: tabular-nums; }
.check { width: 44px; height: 44px; border-radius: 12px; border: none; background: var(--surface-2); color: var(--dim); display: flex; align-items: center; justify-content: center; justify-self: end; }
.check.on { background: var(--accent); color: var(--on-accent); }
.del { width: 36px; height: 40px; border: none; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; }
.add-set { min-height: 48px; border-radius: 14px; border: 1px dashed #3A3F4A; background: transparent; color: var(--muted); font-size: 14px; font-weight: 500; }
.rest { background: var(--surface); border-radius: 20px; padding: 14px 16px; display: flex; align-items: center; gap: 10px; }
.rest .clock { font-family: var(--font-display); font-size: 34px; font-weight: 700; font-variant-numeric: tabular-nums; }
.rest button { width: 52px; height: 48px; border-radius: 14px; border: none; background: var(--surface-2); color: var(--fg); font-weight: 600; font-size: 13px; }
.rest.ready .clock { color: var(--accent); }

/* lists */
.ex { background: var(--surface); border-radius: 16px; overflow: hidden; }
.ex-row { display: flex; align-items: center; gap: 10px; padding: 10px 6px 10px 12px; }
.ex-ini { width: 44px; height: 44px; border-radius: 12px; background: var(--surface-2); color: var(--accent); display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; flex-shrink: 0; }
.ex-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ex-txt b { font-weight: 600; font-size: 15px; }
.lvl { font-size: 11px; font-weight: 600; padding: 4px 8px; border-radius: 999px; flex-shrink: 0; }
.lvl1 { background: #23302A; color: #8FE3B0; } .lvl2 { background: #2C2A20; color: #F2D27A; } .lvl3 { background: #33221B; color: #FFB08A; }
.ibtn { width: 44px; height: 44px; border-radius: 12px; border: none; background: transparent; color: var(--muted); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ibtn.play { color: var(--accent); }
.ibtn.on { background: var(--accent); color: var(--on-accent); }
.search { display: flex; align-items: center; gap: 10px; min-height: 52px; padding: 0 16px; border-radius: 16px; background: var(--surface); color: var(--muted); }
.search input { flex: 1; min-width: 0; border: none; background: transparent; color: var(--fg); font-size: 16px; outline: none; }

/* demo */
.demo { background: #15181D; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; gap: 12px; }
.demo-panels { display: grid; gap: 8px; }
.demo-panel { background: var(--bg); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
.demo-panel svg { width: 100%; height: auto; display: block; }
.demo-panel span { padding: 6px 10px 8px; font-size: 12px; font-weight: 600; color: var(--soft); }
.demo svg .hl { stroke: var(--accent); } .demo svg .lb { stroke: #E8EAED; } .demo svg .bk { stroke: #6B717C; } .demo svg .gh { stroke: var(--ghost); } .demo svg .pr { stroke: #3A3F4A; }
.demo svg .ghf { fill: var(--ghost); } .demo svg .hdf { fill: #E8EAED; } .demo svg .arw { stroke: var(--accent); } .demo svg .arwh { fill: var(--accent); }
.demo ol, .demo ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.demo li { display: flex; gap: 10px; align-items: flex-start; font-size: 14px; line-height: 1.45; color: #DADDE2; }
.demo .no { width: 22px; height: 22px; border-radius: 11px; background: var(--surface-2); flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: var(--fg); }

/* awards, inputs */
.award { background: var(--surface); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 4px; opacity: 0.55; }
.award .aw-ic { width: 40px; height: 40px; border-radius: 12px; background: var(--surface-2); color: var(--muted); display: flex; align-items: center; justify-content: center; margin-bottom: 4px; }
.award.on { opacity: 1; border: 1px solid var(--accent); }
.award.on .aw-ic { background: var(--accent); color: var(--on-accent); }
.speak.on { outline: 2px solid var(--accent); }
select.inp { appearance: auto; }
.yt { width: 100%; aspect-ratio: 16 / 9; border: 0; border-radius: 12px; background: #000; display: block; }
.inp { width: 100%; min-height: 48px; border-radius: 12px; border: 1px solid var(--surface-2); background: var(--bg); color: var(--fg); padding: 0 12px; font-size: 16px; }
/* warm, feel, plates, notes */
.set.warm { background: #15181D; border: 1px dashed #3A3F4A; }
.set.warm .num { color: var(--muted); }
.feel, .plates { background: var(--surface); border-radius: 14px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
.feel .seg { background: var(--surface-2); }
.note { width: 100%; min-height: 84px; border-radius: 14px; border: 1px solid var(--surface-2); background: var(--surface); color: var(--fg); padding: 12px; font-size: 16px; line-height: 1.45; resize: vertical; }
/* edit + charts */
.edrow { display: flex; align-items: center; gap: 6px; padding: 8px 0; border-top: 1px solid var(--surface-2); flex-wrap: wrap; }
.edrow .ex-txt { gap: 6px; min-width: 150px; }
.edbtns { display: flex; gap: 0; margin-left: auto; }
.edbtns .ibtn { width: 40px; }
.ibtn:disabled { opacity: 0.3; }
.lchart { width: 100%; height: auto; display: block; }
.lchart .grid { stroke: var(--surface-2); stroke-width: 1; }
.lchart .tick { fill: var(--muted); font-size: 10px; font-family: var(--font-body); }
.lchart .area { fill: var(--accent); opacity: 0.12; }
.lchart .ln { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
.lchart .dot { fill: var(--bg); stroke: var(--accent); stroke-width: 2; }
.lchart .dotl { fill: var(--accent); }
/* video */
.vid { display: flex; flex-direction: column; gap: 8px; }
.vid video { width: 100%; aspect-ratio: 640 / 420; max-height: 420px; border-radius: 12px; background: #0F1115; display: block; object-fit: contain; }
.vid-empty { width: 100%; text-align: left; display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 12px; border: 1px dashed #3A3F4A; background: transparent; color: var(--muted); line-height: 1.4; }
.spin { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--surface-2); border-top-color: var(--accent); animation: sp 0.8s linear infinite; flex-shrink: 0; }
@keyframes sp { to { transform: rotate(360deg); } }
/* form */
.stepper { background: var(--surface); border-radius: 16px; padding: 10px 10px 10px 16px; display: flex; align-items: center; gap: 10px; }
.stepper .lbl { flex: 1; font-weight: 500; }
.stepper button { width: 44px; height: 44px; border-radius: 12px; border: none; background: var(--surface-2); color: var(--fg); font-size: 20px; }
.stepper .val { min-width: 84px; text-align: center; font-family: var(--font-display); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
.opt { width: 100%; text-align: left; min-height: 60px; padding: 10px 14px; border-radius: 14px; background: var(--surface); color: var(--fg); border: 2px solid transparent; display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.opt.on { border-color: var(--accent); }
.opt small { font-size: 12px; color: var(--muted); }
.skillbtn { min-height: 64px; padding: 10px 12px; border-radius: 14px; text-align: left; background: var(--surface); border: 1px solid var(--surface-2); color: var(--fg); display: flex; flex-direction: column; justify-content: center; gap: 2px; }
.skillbtn small { font-size: 12px; color: var(--muted); }
.skillbtn.on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.skillbtn.on small { color: #3A2312; }
body.mode-gym .skillbtn.on small { color: #2B3510; }

.stage { width: 100%; min-height: 64px; padding: 10px 14px; border-radius: 16px; background: var(--surface); border: 2px solid transparent; color: var(--fg); display: flex; align-items: center; gap: 12px; text-align: left; }
.stage.now { border-color: var(--accent); }
.stage.next { opacity: 0.75; }
.stage .dotn { width: 32px; height: 32px; border-radius: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-display); font-weight: 700; font-size: 14px; background: var(--surface-2); color: var(--muted); }
.stage.done .dotn { background: var(--accent); color: var(--on-accent); }
.stage.now .dotn { background: var(--fg); color: var(--bg); }

.sheet-wrap { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: flex; align-items: flex-end; justify-content: center; z-index: 20; }
.sheet { width: 100%; max-width: 560px; background: var(--surface); border-radius: 24px 24px 0 0; padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 14px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-weight: 600; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
.chart { display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 8px; align-items: end; height: 120px; }
.chart div { display: flex; flex-direction: column; align-items: center; justify-content: flex-end; gap: 6px; height: 100%; }
.chart b { width: 100%; border-radius: 6px; background: #3A3F4A; display: block; min-height: 3px; }
.chart b.cur { background: var(--accent); }
.chart span { font-size: 11px; color: var(--muted); }
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto !important; } }
</style>

const dayKey = (d) => { d = d ? new Date(d) : new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
function targets() {
  const P = S[S.mode] || S.gym; const sexAdj = { m: 5, w: -161, x: -78 }[S.sex || 'x'];
  const bmr = 10 * P.weight + 6.25 * P.height - 5 * P.age + sexAdj;
  const act = P.days <= 3 ? 1.375 : P.days <= 5 ? 1.55 : 1.725;
  const adj = { muskeln: 300, kraft: 200, fett: -400 }[P.goal] || 0;
  const pk = { fett: 2.0, muskeln: 1.8, kraft: 1.8 }[P.goal] || 1.6;
  return { kcal: Math.round((bmr * act + adj) / 10) * 10, protein: Math.round(P.weight * pk) };
}

  bwstep(d) { const list = S.bw || []; const last = list.slice().sort((a, b) => (a.d < b.d ? -1 : 1)).pop(); const cur = ui.bwVal != null ? ui.bwVal : last ? last.kg : S[S.mode].weight; ui.bwVal = Math.max(30, Math.round((cur + +d.d) * 10) / 10); render(); },

  cwstop() { const c = ui.cw || { acc: 0, start: null }; const ms = c.acc + (c.start ? Date.now() - c.start : 0); ui.cw = null; lsSet(LS_KEY + '-cw', null); unwake(); ui.cf = { ...(ui.cf || { type: 'Laufen', km: '', feel: 2 }), min: Math.max(1, Math.round(ms / 60000)) }; toast('Dauer übernommen – jetzt speichern.'); render(); },
  cftype(d) { ui.cf = { ...(ui.cf || { type: 'Laufen', min: 30, km: '', feel: 2 }), type: d.v }; render(); },
  cfmin(d) { const f = ui.cf || { type: 'Laufen', min: 30, km: '', feel: 2 }; ui.cf = { ...f, min: Math.max(1, Math.min(600, f.min + +d.d)) }; render(); },
  cffeel(d) { ui.cf = { ...(ui.cf || { type: 'Laufen', min: 30, km: '', feel: 2 }), feel: +d.v }; render(); },
  cfsave() { const f = ui.cf || { type: 'Laufen', min: 30, km: '', feel: 2 }; const km = Math.max(0, Math.min(500, parseFloat(String(f.km || '').replace(',', '.')) || 0));
    S.cardio = (S.cardio || []).concat({ id: uid(), d: new Date().toISOString(), type: f.type, min: f.min, km: km ? Math.round(km * 100) / 100 : 0, feel: f.feel }).slice(-600); ui.cf = null; save(); toast('Einheit gespeichert'); checkAwardsToast(); render(); },
  cfdel(d) { S.cardio = (S.cardio || []).filter((x) => x.id !== d.id); save(); render(); },
  export() {
    const data = JSON.stringify({ app: 'trainings-app', version: 1, exported: new Date().toISOString(), state: S, history: H }, null, 1);
    try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' })); a.download = 'calimax-backup-' + dayKey() + '.json'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); toast('Backup heruntergeladen'); }
    catch (e) { toast('Backup konnte nicht erstellt werden.'); }
  },

  vreload() { pickVoice(); try { speechSynthesis.getVoices(); } catch (e) {} setTimeout(() => { pickVoice(); render(); toast(deVoices().length + ' deutsche Stimmen gefunden'); }, 400); },
  vtestclip() { unlockAudio(); playClip('coach_on', 'test', 'Sprachansagen sind an.'); },
  vtest() { speak('Hallo! So klingt diese Stimme. Nächste Übung: Klimmzüge. Vier Sätze, Ziel acht bis zehn Wiederholungen.', 'test'); },
  speak(d) { if (ui.speaking === d.n) { stopSpeak(); return; } const demo = document.querySelector(`[data-act="speak"][data-n="${CSS.escape(d.n)}"]`); const v = demo && demo.closest('.demo') && demo.closest('.demo').querySelector('video'); if (v) { try { v.currentTime = 0; v.play(); } catch (e) {} } const c = clipFor(d.n); if (c) playClip(c, d.n, guideText(d.n)); else speak(guideText(d.n), d.n); },
  coach() { S.coach = !S.coach; save(); if (S.coach) { unlockAudio(); coachSay('coach_on', 'Sprachansagen sind an.'); } else stopSpeak(); render(); },
  levelup(d) { const sk = d.s; S.skills[sk] = Math.min((S.skills[sk] || 1) + 1, SKILL[sk].stages.length); T.lvlDone = (T.lvlDone || []).concat(sk); save(); saveActive(); toast('Neue Stufe freigeschaltet'); checkAwardsToast(); render(); },
  edit(d) { ui.edit = +d.s; render(); },
  edend() { ui.edit = null; render(); },

  edsets(d) { const l = edList(+d.s); const e = l[+d.i]; e.sets = Math.min(10, Math.max(1, e.sets + +d.d)); save(); render(); },
  edmove(d) { const l = edList(+d.s); const i = +d.i, j = i + +d.d; if (j < 0 || j >= l.length) return; [l[i], l[j]] = [l[j], l[i]]; save(); render(); },
  eddel(d) { const l = edList(+d.s); l.splice(+d.i, 1); save(); render(); },

  edadd(d) { edList(+d.s); ui.pick = { src: +d.s, at: -1 }; ui.cat = 'Alle'; ui.q = ''; ui.view = 'pick'; render(); },
  pickcat(d) { ui.cat = d.c; render(); },
  pickit(d) { const l = edList(ui.pick.src); if (ui.pick.at >= 0) l[ui.pick.at] = { name: d.n, sets: l[ui.pick.at].sets }; else l.push({ name: d.n, sets: 3 }); save(); toast(ui.pick.at >= 0 ? 'Getauscht' : 'Hinzugefügt'); ui.pick = null; ui.view = 'plan'; ui.cat = 'Alle'; ui.q = ''; render(); },
  edreset(d) { const ed = S.edits[S.mode] || {}; delete ed[+d.s]; save(); toast('Tag zurückgesetzt'); render(); },

  exstat(d) { ui.exstat = d.n; ui.view = 'exstat'; render(); },

function addFood(n, k, p) { const day = ui.foodDay || dayKey(); S.food = S.food || {}; (S.food[day] = S.food[day] || []).push({ n: String(n).slice(0, 60), k, p });
  const keys = Object.keys(S.food).sort(); while (keys.length > 120) delete S.food[keys.shift()];
  save(); toast(n + ' hinzugefügt'); checkAwardsToast(); render(); }
function advance(status) {
  const e = T.ex[T.idx];
  e.status = status === 'skipped' && e.sets.some((s) => s.done) ? 'done' : status;
  T.rest = 0; ui.showDemo = false;
  if (T.idx >= T.ex.length - 1) { finishTraining(); return; }

  else if (S.coach) { const n = T.ex[T.idx]; speak('Nächste Übung: ' + n.name + '. ' + n.sets.filter((x) => !x.warm).length + ' Sätze, Ziel ' + String(n.target).replace('–', ' bis ') + (n.hold ? '' : ' Wiederholungen') + '.', 'coach'); }

}
document.addEventListener('click', (ev) => {
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  if (el.classList.contains('sheet-wrap') && ev.target.closest('[data-stop]') && !ev.target.closest('.sheet [data-act]')) return;
  const fn = A[el.dataset.act]; if (fn) { ev.preventDefault(); fn(el.dataset); }
});
document.getElementById('vid-file').addEventListener('change', async (ev) => {
  const file = ev.target.files && ev.target.files[0]; const name = ui.vidFor; if (!file || !name || !store.assets) return;
  if (file.size > 60 * 1024 * 1024) { toast('Das Video ist zu groß (max. 60 MB). Nimm einen kürzeren Clip auf, 5–10 Sek. reichen.'); return; }
  const t = (file.type || '').toLowerCase();
  const type = t === 'video/webm' ? 'video/webm' : 'video/mp4';
  ui.uploading = name; render();
  try {
    const res = await store.assets.upload(file, { type });
    const old = S.videos[name]; S.videos[name] = res.id; save();
    if (old && !Object.values(S.videos).includes(old)) store.assets.delete(old).catch(() => {});
    toast('Video gespeichert');
  } catch (e) {
    const c = e && e.code;
    toast(c === 'too_large' ? 'Das Video ist zu groß (max. 20 MB).' : c === 'unsupported_type' ? 'Dieses Videoformat geht nicht. Bitte MP4 oder WebM verwenden.' : c === 'quota_or_state' ? 'Der Speicher für Videos ist voll. Entferne ein altes Video.' : 'Hochladen hat nicht geklappt. Versuch es gleich nochmal.');
  }
  ui.uploading = null; render();
});
document.getElementById('bk-file').addEventListener('change', async (ev) => {
  const file = ev.target.files && ev.target.files[0]; if (!file) return;
  let data; try { data = JSON.parse(await file.text()); } catch (e) { toast('Die Datei ist kein gültiges Backup.'); return; }
  if (!data || data.app !== 'trainings-app' || !data.state || !Array.isArray(data.history)) { toast('Die Datei ist kein Backup dieser App.'); return; }
  ui.sheet = { title: 'Backup einspielen?', text: 'Profil, Pläne, Ernährung und Cardio werden durch das Backup vom ' + fmtDate(data.exported) + ' ersetzt. Trainings im Verlauf werden zusammengeführt, nichts geht verloren.', yes: 'Einspielen', act: () => {
    const vids = S.videos; S = mergeState(data.state); S.videos = { ...(data.state.videos || {}), ...vids };
    const ids = new Set(H.map((h) => h.id)); const add = data.history.filter((h) => h && h.id && !ids.has(h.id));
    H = H.concat(add).sort((a, b) => (a.date < b.date ? 1 : -1)); save(); saveLocal();
    if (store.ok) add.forEach((h) => store.col.doc(h.id).set(h).catch(() => {}));
    toast('Backup eingespielt (' + add.length + ' Trainings ergänzt)'); ui.view = S.mode ? 'home' : 'start'; render(); } };
  render();
});
setInterval(() => { if (ui.view !== 'cardio' || !ui.cw || !ui.cw.start) return; const el = document.getElementById('cw-t'); if (el) el.textContent = mmss(Math.floor((ui.cw.acc + Date.now() - ui.cw.start) / 1000)); }, 1000);

loadLocal();

if (S.mode) ui.view = T && !T.done ? 'train' : T && T.done ? 'finish' : 'home';
